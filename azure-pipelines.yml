# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: 
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '1.9.8'

- script: |
      echo "Repository root:"
      ls -la "$(System.DefaultWorkingDirectory)"

      echo "Terraform configuration files:"
      find "$(System.DefaultWorkingDirectory)" -type f \
        \( -name "*.tf" -o -name "*.tf.json" \)
  displayName: 'Verify Terraform files'
- task: TerraformTask@5
  displayName: Terraform Init
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendAzureRmUseEntraIdForAuthentication: false
    backendServiceArm: 'sukanya-sangireddy(ed7431f1-0b5d-4297-b517-7f4bbb9bbc19)'
    backendAzureRmOverrideSubscriptionID: 'ed7431f1-0b5d-4297-b517-7f4bbb9bbc19'
    backendAzureRmResourceGroupName: 'storage-rg'
    backendAzureRmStorageAccountName: 'azureremotebackend'
    backendAzureRmContainerName: 'remotestate'
    backendAzureRmKey: 'remotestate'

- task: TerraformTask@5
  displayName: Plan
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'sukanya-sangireddy(2)(ed7431f1-0b5d-4297-b517-7f4bbb9bbc19)'
    environmentAzureRmOverrideSubscriptionID: 'ed7431f1-0b5d-4297-b517-7f4bbb9bbc19'